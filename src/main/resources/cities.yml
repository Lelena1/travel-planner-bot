# Справочник городов для поиска жилья: как каждый сайт называет город в адресе страницы.
#
# ostrovok — путь в адресе ostrovok.ru/hotel/<путь>/. Проверено 19.11.2026: все пути открываются.
# avito    — город в адресе avito.ru/<город>/kvartiry/sdam/posutochno-…
# cian     — поддомен <поддомен>.cian.ru (у Москвы — www).
#            Авито и ЦИАН защищены от автоматических проверок, их адреса проверяются вручную
#            (19.11.2026 открыты из бота для Калининграда: посуточная аренда в городе).
# sutochno — есть ли город на Суточно.ру (город передаётся названием, адрес не нужен).
# tripster — город в адресе experience.tripster.ru/experience/<город>/ (экскурсии).
#            Проверено 19.11.2026: у всех городов открывается страница «Экскурсии в …».
# nearby   — куда обычно ездят на день: точные названия статей Википедии
#            (проверено 19.11.2026, у всех статей есть координаты).
# aliases  — как ещё пишут название города.

cities:
