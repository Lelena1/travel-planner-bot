name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # На GitHub-раннере есть Docker, поэтому интеграционные тесты с PostgreSQL здесь выполняются
      - name: Build and test
        run: ./mvnw -B verify
